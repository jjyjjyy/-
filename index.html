    extrovertedMover:{title:"활기찬 에너지파",name:"윤서아",subtitle:"외향적인 운동가",oneLine:"사람들과 함께 움직일 때 더 힘이 나는 활기찬 에너지파",description:"당신은 사람들과 같이 움직일 때 더 신나는 학생이네요! 학교에서 함께할 활동과 사람들을 소개해 줄 CA가 잘 어울려요.",photo:"",color:"#f3d4d7",counselUrl:"",icon:"🤝"},
    allrounder:{title:"만능 올라운더",name:"이승민",subtitle:"만능 올라운더",oneLine:"예술부터 운동까지, 혼자서도 여럿이서도 잘 즐기는 만능 올라운더",description:"당신은 이것저것 모두 해보고 싶은 학생이네요! 다양한 학교생활을 함께 살펴보고 내게 맞는 길을 찾아줄 CA가 잘 어울려요.",photo:"",color:"#d3dcf5",counselUrl:"",icon:"🧭"}
  };

    {title:"내일 친구들과 밥약을 잡기로 했다! 약속을 잡을 때 나는?",answers:["미리 계획하는 게 편하지. 우리 언제 볼까?!","즉흥적인 것도 좋지! 내일은 뭐가 먹고싶을까?"]},
    {title:"취미활동을 할 때 더 편한 것은?",answers:["혼자 또는 소수로 움직이기는 게 마음이 차분해져","여러 사람과 함께 움직여야 에너지가 생기지!"]}
  ];
  const EN = {
    homeEyebrow:"Find your CA match",homeTitle:"This semester,<br>which CA fits your vibe?",homeDescription:"Answer three quick questions to meet a CA who might click with you. Then you can chat with them or join the CA group!",startKo:"한국어로 시작",startEn:"Start in English",privacy:"Your answers aren't stored or sent anywhere.",duration:"3 questions · ~30 sec",footer:"A just-for-fun CA introduction · Not a psychological assessment.",previous:"Previous question",backHome:"Back to start",resultPrefix:"You're a",counsel:"Chat with this CA ↗",group:"Join the CA group — friends are already there! ↗",pizza:"🍕 Pizza party attendance survey ↗",other:"Explore other CA types",retry:"Try again",allEyebrow:"MEET THE CA CREW",allTitle:"Meet the other CAs",returnResult:"Back to my result",profile:"CA profile",match:"Your CA match",major:"Major",interest:"Interests",mbti:"MBTI",missing:"To be added",linkMissing:"This link hasn't been added yet.",copy:"CA counseling is an open, easygoing space. Big worries or small ones, come talk it over with a cup of coffee!",
    questions:[
      {title:"Assignments done! You finally have a free weekend. What sounds good?",answers:["A film or exhibition I've been meaning to see.","The weather's nice — let's get outside and move!","Both. Why choose just one?"]},
      {title:"When making plans, you're more likely to...",answers:["Plan ahead.","Go with how I feel that day."]},
      {title:"What feels more comfortable when doing something active?",answers:["Doing it alone or in a small group.","Doing it with a crowd."]}

    types:{
      plannedArtist:{name:"Yejin Jeong",title:"The Thoughtful Tastemaker",subtitle:"The Planned Artist",oneLine:"A thoughtful tastemaker with a plan and an eye for details",description:"You're the kind of student who likes to explore your options and make plans that fit your tastes! A CA who listens closely and helps you sort through ideas might be a great match."},
      spontaneousArtist:{name:"Jihyeong Kang",title:"The Free-Spirited Explorer",subtitle:"The Spontaneous Artist",oneLine:"A free-spirited explorer who follows what inspires them",description:"You're the kind of student who wants to try something as soon as it catches your eye! A CA who helps you discover new activities and chat through ideas might be a great match."},
      introvertedMover:{name:"Junhyeok Lee",title:"The Quiet Doer",subtitle:"The Introverted Mover",oneLine:"A quiet doer who keeps moving at their own pace",description:"You're the kind of student who stays active while keeping your own pace! A CA you can talk to one-on-one, without pressure, might be a great match."},
      extrovertedMover:{name:"Seoa Yoon",title:"The Social Energizer",subtitle:"The Extroverted Mover",oneLine:"A social energizer who's happiest doing things together",description:"You're the kind of student who gets energized when other people join in! A CA who can introduce you to campus activities and new faces might be a great match."},
      allrounder:{name:"Seungmin Lee",title:"The All-Rounder",subtitle:"The All-Rounder",oneLine:"An all-rounder who enjoys a little bit of everything",description:"You're the kind of student who wants to try it all! A CA who can explore different parts of campus life with you might be a great match."}
    }
  };
  let lang="ko";
  function label(en,ko){return lang==="en"?EN[en]:ko}
  function typeText(key,c,field){return lang==="en"?EN.types[key][field]:c[field]}
  function profileText(c,field){return lang==="en"?c.enProfile[field]:c[field]}
  function setLanguage(next,begin=false){lang=next;document.documentElement.lang=lang;document.querySelector("#brand").textContent=lang==="ko"?"CA 찾기 ✳":"Find your CA ✳";document.querySelector("#duration").textContent=label("duration","3문항 · 약 30초");document.querySelector("#footer").textContent=label("footer","가볍게 즐기는 CA 소개 테스트 · 전문적인 성향 검사가 아닙니다.");document.querySelector("#language-toggle").textContent=lang==="ko"?"English":"한국어";home();if(begin)showQuestion(0)}
  const app=document.querySelector("#app");let step=-1;let responses=[];let currentResult=null;let selectedProfile=null;let profileOrigin="all";let view="home";
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  function avatar(c){return `<img class="avatar" src="${escapeHtml(c.photo)}" alt="${escapeHtml(lang==="en"?"CA portrait":"CA 사진")}" onerror="if(!this.dataset.tryPng){this.dataset.tryPng='1';this.src=this.src.replace(/\\.jpg(?=\\?|$)/,'.png');return}if(!this.dataset.tryWebp){this.dataset.tryWebp='1';this.src=this.src.replace(/\\.png(?=\\?|$)/,'.webp');return}this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="avatar" style="display:none;--accent:${c.color}" aria-hidden="true">${escapeHtml(c.name.slice(-2))}</span>`}

  function button(label,url,kind=""){return url?`<a class="primary ${kind}" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`:`<button class="primary ${kind}" disabled>${label}</button><small class="hint">${escapeHtml(labelMissing())}</small>`}
  function labelMissing(){return label("linkMissing","관리자가 링크를 등록하면 이용할 수 있어요.")}
  function home(){view="home";step=-1;responses=[];currentResult=null;selectedProfile=null;app.innerHTML=`<section class="card"><div class="eyebrow">${escapeHtml(label("homeEyebrow","나와 어울리는 CA 찾기"))}</div><div class="hero" aria-hidden="true">🧭</div><h1>${label("homeTitle","이번 학기,<br>어떤 CA가 나와 맞을까?")}</h1><p>${escapeHtml(label("homeDescription","세 가지 질문만 답하면 나와 어울리는 CA를 만나볼 수 있어요. 결과를 보고 상담을 신청하거나 친구들이 있는 CA 단체방에 들어와 보세요!"))}</p><div class="lang-choice"><button class="primary" id="start-ko">한국어로 시작 →</button><button class="secondary" id="start-en">Start in English →</button></div><p class="hint">${escapeHtml(label("privacy","응답은 저장하거나 전송하지 않습니다."))}</p></section>`;document.querySelector("#start-ko").onclick=()=>setLanguage("ko",true);document.querySelector("#start-en").onclick=()=>setLanguage("en",true)}
  function showQuestion(i){view="question";step=i;const q=(lang==="en"?EN.questions:questions)[i];app.innerHTML=`<section class="card"><div class="eyebrow">QUESTION ${i+1} / ${questions.length}</div><div class="progress"><span style="width:${(i+1)/questions.length*100}%"></span></div><h2>${escapeHtml(q.title)}</h2><div class="stack">${q.answers.map((a,j)=>`<button class="answer" data-answer="${j}">${escapeHtml(a)}</button>`).join("")}</div><button class="back" id="back">← ${escapeHtml(i?label("previous","이전 질문"):label("backHome","처음으로"))}</button></section>`;document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{responses[i]=Number(b.dataset.answer);if(i===questions.length-1)showResult(determine(responses));else showQuestion(i+1)});document.querySelector("#back").onclick=()=>i?showQuestion(i-1):home()}
  function showResult(key){view="result";currentResult=key;const c=CA[key];app.innerHTML=`<section class="card result"><div class="eyebrow">YOUR CA TYPE ✳</div><h1>${lang==="en"?`You are <strong>${escapeHtml(typeText(key,c,"title"))}</strong>!`:`당신은 <strong>${escapeHtml(c.title)}</strong>입니다!`}</h1><p class="subtitle">${escapeHtml(typeText(key,c,"oneLine"))}</p><p class="note">${escapeHtml(typeText(key,c,"description"))}</p><button class="profile result-profile-link" id="result-profile" type="button" aria-label="${escapeHtml(typeText(key,c,"name"))} CA ${escapeHtml(label("profile","프로필"))}"><span class="result-photo">${avatar(c)}<span class="icon-badge" aria-label="${escapeHtml(typeText(key,c,"subtitle"))} icon">${escapeHtml(c.icon)}</span></span><span><strong>${escapeHtml(typeText(key,c,"name"))} CA</strong><small>${escapeHtml(typeText(key,c,"subtitle"))} · ${escapeHtml(label("match","나와 어울리는 CA"))}</small><small>${escapeHtml(lang==="en"?"View profile":"프로필 보기")} ↗</small></span><span class="profile-arrow" aria-hidden="true">↗</span></button><p class="counsel-copy">${escapeHtml(label("copy",COMMON_COUNSEL_MESSAGE))}</p><div class="stack">${button(label("counsel","이 CA에게 상담 신청하기 ↗"),c.counselUrl,"counsel-action")}${button(label("group","CA 단체방 들어가기 — 이미 친구들이 기다리고 있어요! ↗"),COMMON_GROUP_URL)}${PIZZA_PARTY_URL?`<a class="event-link" href="${escapeHtml(PIZZA_PARTY_URL)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label("pizza","🍕 피자파티 참석 수요조사 ↗"))}</a>`:`<span class="event-link" aria-disabled="true">${escapeHtml(label("pizza","🍕 피자파티 참석 수요조사 ↗"))}</span><small class="hint">${escapeHtml(label("linkMissing","피자파티 구글폼 링크를 등록하면 이용할 수 있어요."))}</small>`}<button class="secondary" id="others">${escapeHtml(label("other","다른 CA 유형도 살펴보기"))}</button><button class="linkbtn" id="retry">${escapeHtml(label("retry","테스트 다시 하기"))}</button></div></section>`;document.querySelector("#result-profile").onclick=()=>{profileOrigin="result";showProfile(key)};document.querySelector("#others").onclick=showAll;document.querySelector("#retry").onclick=home}
  function showAll(){view="all";app.innerHTML=`<section class="card"><div class="eyebrow">${escapeHtml(label("allEyebrow","MEET THE CA CREW"))}</div><h2>${escapeHtml(label("allTitle","다른 CA도 만나볼까요?"))}</h2><div class="list">${Object.entries(CA).map(([key,c])=>`<button class="mini" data-profile="${key}"><span class="photo-frame" style="--accent:${c.color}">${avatar(c)}</span><span class="mini-text"><strong>${escapeHtml(typeText(key,c,"title"))} · ${escapeHtml(typeText(key,c,"name"))} CA</strong></span></button>`).join("")}</div><hr class="divider"><button class="secondary" id="return">${escapeHtml(label("returnResult","내 결과로 돌아가기"))}</button></section>`;document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>{profileOrigin="all";showProfile(b.dataset.profile)});document.querySelector("#return").onclick=()=>currentResult?showResult(currentResult):home()}
  function showProfile(key){view="profile";selectedProfile=key;const c=CA[key];app.innerHTML=`<section class="card result"><div class="eyebrow">${escapeHtml(label("profile","CA 프로필"))}</div><h1>${escapeHtml(typeText(key,c,"name"))} CA</h1><p class="subtitle">${escapeHtml(typeText(key,c,"title"))} · ${escapeHtml(typeText(key,c,"subtitle"))}</p><div class="profile profile-big"><div class="photo-frame" style="--accent:${c.color}">${avatar(c)}</div><div class="profile-text"><strong>${escapeHtml(typeText(key,c,"name"))} CA</strong><small>${escapeHtml(typeText(key,c,"subtitle"))}</small></div></div><dl class="profile-facts"><div><dt>${escapeHtml(label("major","전공"))}</dt><dd>${escapeHtml(profileText(c,"major"))}</dd></div><div><dt>${escapeHtml(label("interest","관심사"))}</dt><dd>${escapeHtml(profileText(c,"interest"))}</dd></div><div><dt>MBTI</dt><dd>${escapeHtml(profileText(c,"mbti"))}</dd></div></dl><div class="stack">${button(label("counsel","이 CA에게 상담 신청하기 ↗"),c.counselUrl,"counsel-action")}${button(label("group","CA 단체방 들어가기 ↗"),COMMON_GROUP_URL)}<button class="secondary" id="return">${escapeHtml(profileOrigin==="result"?label("returnResult","내 결과로 돌아가기"):label("other","다른 CA 유형도 살펴보기"))}</button></div></section>`;document.querySelector("#return").onclick=()=>profileOrigin==="result"&&currentResult?showResult(currentResult):showAll()}
  async function readLink(filename){for(const suffix of [".txt",""]){try{const res=await fetch(`ca-assets/${filename}${suffix}`,{cache:"no-store"});if(!res.ok)continue;const value=(await res.text()).trim();if(/^https:\/\/[^\s]+$/i.test(value))return value}catch{}}return ""}
  async function readInfo(filename,fallback="추후 입력"){try{const res=await fetch(`ca-assets/${filename}.txt`,{cache:"no-store"});if(!res.ok)return fallback;return (await res.text()).trim().slice(0,180)||fallback}catch{return fallback}}
  async function loadAssets(){const keys=Object.keys(CA);keys.forEach((key,i)=>{CA[key].photo=`ca-assets/ca${i+1}_photo.jpg`;CA[key].major="추후 입력";CA[key].interest="추후 입력";CA[key].mbti="추후 입력";CA[key].enProfile={major:EN.missing,interest:EN.missing,mbti:EN.missing}});const links=await Promise.all([...keys.map((_,i)=>readLink(`ca${i+1}_link`)),readLink("ca_chat_link"),readLink("pizza_party_link")]);keys.forEach((key,i)=>CA[key].counselUrl=links[i]);COMMON_GROUP_URL=links[5];PIZZA_PARTY_URL=links[6];const profiles=await Promise.all(keys.map(async(key,i)=>{const prefix=`ca${i+1}_`;return Promise.all([readInfo(prefix+"major"),readInfo(prefix+"interest"),readInfo(prefix+"mbti"),readInfo(prefix+"icon"),readInfo(prefix+"major_en",EN.missing),readInfo(prefix+"interest_en",EN.missing),readInfo(prefix+"mbti_en",EN.missing),readInfo(prefix+"name_en",EN.types[key].name)])}));keys.forEach((key,i)=>{[CA[key].major,CA[key].interest,CA[key].mbti]=profiles[i].slice(0,3);if(profiles[i][3]!=="추후 입력")CA[key].icon=profiles[i][3].slice(0,4);[CA[key].enProfile.major,CA[key].enProfile.interest,CA[key].enProfile.mbti]=profiles[i].slice(4,7);EN.types[key].name=profiles[i][7]});if(view==="result"&&currentResult)showResult(currentResult);else if(view==="profile"&&selectedProfile)showProfile(selectedProfile)}
  document.querySelector("#language-toggle").onclick=()=>setLanguage(lang==="ko"?"en":"ko");home();loadAssets();
</script></body></html>
