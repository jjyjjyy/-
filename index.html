<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2eb">
  <meta name="description" content="30초 만에 나와 어울리는 CA를 찾아보세요.">
  <title>나와 어울리는 CA 찾기</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#252325;background:#f6f2eb}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,a{font:inherit}button{cursor:pointer}.shell{max-width:560px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}.brand{letter-spacing:-.04em;font-size:20px}.tag{background:#fff;border:1px solid #e8e2d9;border-radius:99px;padding:8px 12px;font-size:12px}.card{margin-top:40px;background:#fff;border:1px solid #e9e3db;border-radius:28px;padding:32px 26px;box-shadow:0 16px 45px #2820160b}.eyebrow{color:#7f6b50;font-size:13px;font-weight:800;letter-spacing:.02em}h1{font-size:38px;line-height:1.2;letter-spacing:-.055em;margin:18px 0}h2{font-size:27px;line-height:1.35;letter-spacing:-.045em;margin:14px 0 26px}p{line-height:1.7;color:#59565a}.hero{font-size:86px;margin:30px 0 18px}.primary,.secondary,.answer{width:100%;border-radius:16px;padding:17px 18px;text-align:center;text-decoration:none;display:block}.primary{background:#28222f;color:#fff;border:0;font-weight:800}.secondary{background:#f6f2eb;color:#292530;border:1px solid #e9e2d9;font-weight:700}.primary:hover{background:#51415c}.secondary:hover,.answer:hover{background:#eee8f0}.primary:disabled,.secondary:disabled{opacity:.48;cursor:not-allowed}.hint{font-size:12px;color:#7d787d;margin-top:12px;text-align:center}.stack{display:grid;gap:11px;margin-top:25px}.answer{text-align:left;background:#f8f6f2;border:1px solid #ebe5dc;color:#242127;font-weight:650;line-height:1.5}.progress{height:7px;background:#eeeae4;border-radius:99px;overflow:hidden;margin:19px 0 35px}.progress span{display:block;height:100%;background:#a178bb;transition:width .2s}.back,.linkbtn{background:none;border:0;color:#6e6075;text-decoration:underline;padding:10px 0}.back{margin-top:16px}.profile{display:flex;align-items:center;gap:17px;background:#f8f6f2;border-radius:19px;padding:15px;margin:24px 0}.avatar{width:67px;height:67px;border-radius:17px;object-fit:cover;background:var(--accent,#d8b7ef);display:grid;place-items:center;font-weight:900;font-size:24px;flex:none}.profile strong{display:block}.profile small{display:block;color:#69636b;margin-top:5px}.result h1{font-size:31px}.subtitle{font-weight:800;color:#725486}.note{background:#f5f0f6;border-left:4px solid #a178bb;padding:15px 18px;border-radius:7px 14px 14px 7px}.list{display:grid;gap:12px}.mini{display:flex;align-items:center;gap:14px;border:1px solid #eae3da;border-radius:15px;background:#fff;padding:13px;text-align:left;width:100%}.mini .avatar{width:48px;height:48px;font-size:18px;border-radius:12px}.mini strong{display:block}.mini small{display:block;color:#777078}.divider{border:0;border-top:1px solid #ece7df;margin:24px 0}.foot{text-align:center;color:#8e878e;font-size:12px;margin-top:24px}@media(max-width:440px){.card{padding:27px 21px;margin-top:28px}h1{font-size:33px}h2{font-size:24px}}
  </style>
</head>
<body><main class="shell"><header class="top"><span class="brand">CA 찾기 ✳</span><span class="tag">3문항 · 약 30초</span></header><div id="app" aria-live="polite"></div><p class="foot">가볍게 즐기는 CA 소개 테스트 · 전문적인 성향 검사가 아닙니다.</p></main>
<script>
  // 여기에서 실제 상담/단체방 링크와 CA 소개, 사진 경로를 바꾸세요.
  // 링크를 입력하지 않으면 버튼은 비활성화됩니다. 예: https://open.kakao.com/o/...
  const COMMON_GROUP_URL = "";
  const COMMON_COUNSEL_MESSAGE = "CA 상담은 자유로운 상담 창구입니다! 가벼운 고민부터 무거운 고민까지, 커피 한 잔과 함께 나눠봐요!";
  const CA = {
    plannedArtist:{title:"꼼꼼한 취향파",name:"정예진",subtitle:"계획적인 예술가",oneLine:"일정도 감성도 놓치지 않는 꼼꼼한 취향파",description:"하고 싶은 것도 꼼꼼히 알아보고, 내 취향에 맞는 선택을 하는 편이네요. 학교생활이나 활동을 알아볼 때도 차근차근 이야기를 나누며 함께 정리해 줄 CA가 잘 어울려요.",photo:"",color:"#ead7ee",counselUrl:""},
    spontaneousArtist:{title:"자유로운 탐험가",name:"강지형",subtitle:"즉흥적인 예술가",oneLine:"재미와 영감을 따라 움직이는 자유로운 탐험가",description:"끌리는 게 생기면 직접 해봐야 직성이 풀리는 편이네요. 관심 있는 활동을 같이 찾아보고 편하게 이야기를 나눌 CA가 잘 어울려요.",photo:"",color:"#f6d9bc",counselUrl:""},
    introvertedMover:{title:"조용한 실행파",name:"이준혁",subtitle:"내향적인 운동가",oneLine:"혼자서도 꾸준히 움직이는 조용한 실행파",description:"나만의 속도로 꾸준히 해내는 편이네요. 부담 없이 일대일로 이야기하며 필요한 정보를 얻을 수 있는 CA가 잘 어울려요.",photo:"",color:"#c9e4d9",counselUrl:""},
    extrovertedMover:{title:"활기찬 에너지파",name:"윤서아",subtitle:"외향적인 운동가",oneLine:"사람들과 함께 움직일 때 더 힘이 나는 활기찬 에너지파",description:"사람들과 함께할 때 더 신나는 편이네요. 학교에서 함께할 활동을 소개하고 새로운 친구를 만나는 데 도움을 줄 CA가 잘 어울려요.",photo:"",color:"#f3d4d7",counselUrl:""},
    allrounder:{title:"만능 올라운더",name:"이승민",subtitle:"만능 올라운더",oneLine:"예술부터 운동까지, 혼자서도 여럿이서도 잘 즐기는 만능 올라운더",description:"하고 싶은 게 하나로 딱 정해지지 않나요? 여러 활동을 두루 알아보고 내게 맞는 선택을 함께 찾아볼 CA가 잘 어울려요.",photo:"",color:"#d3dcf5",counselUrl:""}
  };
  const questions=[
    {title:"과제 끝! 드디어 주말이다. 간만에 쉬는 날인데 무엇을 해볼까?",answers:["영화가 그렇게 재밌다던데, 문화생활을 즐겨볼까?","날도 좋은데, 갑천이라도 뛰어야지! 운동을 하러 가자.","둘 다 좋다. 주말을 알차게 써야지!"]},
    {title:"약속을 잡을 때 나는?",answers:["미리 계획하는 편이다.","당일 기분에 따라 움직이는 편이다."]},
    {title:"활동할 때 더 편한 것은?",answers:["혼자 또는 소수로 움직이기","여러 사람과 함께 움직이기"]}
  ];
  const app=document.querySelector("#app");let step=-1;let responses=[];let currentResult=null;
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  function avatar(c){return c.photo?`<img class="avatar" src="${escapeHtml(c.photo)}" alt="${escapeHtml(c.name)} CA 사진" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="avatar" style="display:none;--accent:${c.color}">${escapeHtml(c.name.slice(-2))}</span>`:`<span class="avatar" style="--accent:${c.color}" aria-hidden="true">${escapeHtml(c.name.slice(-2))}</span>`}
  function determine(a){if(a[0]===2)return "allrounder";if(a[0]===0)return a[1]===0?"plannedArtist":"spontaneousArtist";return a[2]===0?"introvertedMover":"extrovertedMover"}
  function button(label,url){return url?`<a class="primary" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`:`<button class="primary" disabled title="관리자가 링크를 등록하지 않았습니다">${label}</button><small class="hint">관리자가 링크를 등록하면 이용할 수 있어요.</small>`}
  function home(){step=-1;responses=[];currentResult=null;app.innerHTML=`<section class="card"><div class="eyebrow">나와 어울리는 CA 찾기</div><div class="hero" aria-hidden="true">🧭</div><h1>이번 학기,<br>어떤 CA가 나와 맞을까?</h1><p>세 가지 질문만 답하면 나와 어울리는 CA를 만나볼 수 있어요. 결과를 보고 상담을 신청하거나 친구들이 있는 CA 단체방에 들어와 보세요!</p><div class="stack"><button class="primary" id="start">테스트 시작하기 →</button></div><p class="hint">응답은 저장하거나 전송하지 않습니다.</p></section>`;document.querySelector("#start").onclick=()=>showQuestion(0)}
  function showQuestion(i){step=i;const q=questions[i];app.innerHTML=`<section class="card"><div class="eyebrow">QUESTION ${i+1} / ${questions.length}</div><div class="progress"><span style="width:${(i+1)/questions.length*100}%"></span></div><h2>${escapeHtml(q.title)}</h2><div class="stack">${q.answers.map((a,j)=>`<button class="answer" data-answer="${j}">${escapeHtml(a)}</button>`).join("")}</div><button class="back" id="back">← ${i?"이전 질문":"처음으로"}</button></section>`;document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{responses[i]=Number(b.dataset.answer);if(i===questions.length-1)showResult(determine(responses));else showQuestion(i+1)});document.querySelector("#back").onclick=()=>i?showQuestion(i-1):home()}
  function showResult(key){currentResult=key;const c=CA[key];app.innerHTML=`<section class="card result"><div class="eyebrow">YOUR CA TYPE ✳</div><h1>당신은 ${escapeHtml(c.title)}입니다!</h1><p class="subtitle">${escapeHtml(c.oneLine)}</p><p class="note">${escapeHtml(c.description)}</p><p>${escapeHtml(COMMON_COUNSEL_MESSAGE)}</p><div class="profile">${avatar(c)}<div><strong>${escapeHtml(c.name)} CA</strong><small>${escapeHtml(c.subtitle)} · 나와 어울리는 CA</small></div></div><div class="stack">${button("이 CA에게 상담 신청하기 ↗",c.counselUrl)}${button("CA 단체방 들어가기 — 이미 친구들이 기다리고 있어요! ↗",COMMON_GROUP_URL)}<button class="secondary" id="others">다른 CA 유형도 살펴보기</button><button class="linkbtn" id="retry">테스트 다시 하기</button></div></section>`;document.querySelector("#others").onclick=showAll;document.querySelector("#retry").onclick=home}
  function showAll(){app.innerHTML=`<section class="card"><div class="eyebrow">CA 프로필</div><h2>다른 CA도 만나볼까요?</h2><div class="list">${Object.entries(CA).map(([key,c])=>`<button class="mini" data-profile="${key}">${avatar(c)}<span><strong>${escapeHtml(c.title)} · ${escapeHtml(c.name)} CA</strong><small>${escapeHtml(c.subtitle)}</small></span></button>`).join("")}</div><hr class="divider"><button class="secondary" id="return">내 결과로 돌아가기</button></section>`;document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>showProfile(b.dataset.profile));document.querySelector("#return").onclick=()=>currentResult?showResult(currentResult):home()}
  function showProfile(key){const c=CA[key];app.innerHTML=`<section class="card result"><div class="eyebrow">CA 프로필</div><h1>${escapeHtml(c.title)}</h1><p class="subtitle">${escapeHtml(c.oneLine)}</p><div class="profile">${avatar(c)}<div><strong>${escapeHtml(c.name)} CA</strong><small>${escapeHtml(c.subtitle)}</small></div></div><p class="note">${escapeHtml(c.description)}</p><div class="stack">${button("이 CA에게 상담 신청하기 ↗",c.counselUrl)}${button("CA 단체방 들어가기 ↗",COMMON_GROUP_URL)}<button class="secondary" id="return">다른 CA 유형도 살펴보기</button></div></section>`;document.querySelector("#return").onclick=showAll}
  home();
</script></body></html>
